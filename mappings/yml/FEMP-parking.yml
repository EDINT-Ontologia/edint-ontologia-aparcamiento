prefixes:
  edintinf: https://edint.es/def/infraestructura#
  schema: http://www.owl-ontologies.com/schema#
  geosparql: http://www.opengis.net/ont/geosparql#
  dct: http://purl.org/dc/terms/
  edintapar: https://edint.es/def/aparcamiento#

sources:
  parking-source: ['data.csv~csv']
  facility-source: ['data.csv~csv']

mappings:
  parking:
    sources:
      - parking-source
    s: http://example.org/resource/on-street-parking/$(pk)
    po:
      - [a, edintapar:OnStreetParking]
      - [edintapar:hasParkingFee,"http://example.org/resource/parking-fee/$(identificador_tarifa)~iri"]
      - [edintapar:hasSpotsByParkingPermitType,"http://example.org/resource/parking-spots-by-permit-type/$(identificador_plaza)~iri" ]
      - [edintapar:hasSpotsByVehicleType, "http://example.org/resource/parking-spots-by-vehicle-type/$(identificador_plazas)~iri"]
      - [edintapar:isPartOfZone, "http://example.org/resource/regulated-parking-zone/$(identificador_zona)~iri"]
      - [dct:identifier,"$(pk)"]
      - [rdfs:label, "$(nombre)"]
      - [rdfs:comment, $(descripcion_entidad)]
      - [geosparql:hasGeometry, "http://example.org/resource/geometry/$(pk)~iri"]
      - [edintinf:belongsTo, "http://example.org/resource/barrio/$(barrio)~iri"] # Otros e.g territorio/Comarca/D.C._Zaragoza, sector-publico/territorio/Provincia/Zaragoza
      - [edintinf:hasObservationPoint, "http://example.org/resource/observation-point/$(punto_observ_id)~iri"] # Check FEMP-observationPoint.yml
      - [edintinf:hasInfrastructureType, "edintkos:$(tipo)~iri"] # SKOS tipo_infraestructura
      - [edintinf:hasRegisteredOwner, "http://example.org/resource/organization/$(pk)~iri"] # Organizacion
      - [schema:address, "http://example.org/resource/direccion-postal/$(codigo_postal)~iri"] # Check FEMP-postalAddress.yml
      - [schema:openingHours,$(horario)]
      - [edintinf:containsFacility,"http://example.org/resource/facility/$(parent_equipamiento_municipal_id)~iri" ]

  locations:
    sources:
      - facility-source
    s: http://example.org/resource/geometry/$(pk)
    po:
      - [a, geosparql:Geometry]
      - [dct:identifier,"$(pk)"]
      - [geosparql:asWKT, "POINT ($(longitud) $(latitud))", geosparql:wktLiteral]